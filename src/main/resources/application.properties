# =====================================================================
# Aplicación
# =====================================================================
quarkus.application.name=1-quarkus-app
quarkus.application.version=1.0.0-SNAPSHOT

# =====================================================================
# Servidor HTTP
# =====================================================================
quarkus.http.port=8080
# Puerto usado por los tests (@QuarkusTest)
quarkus.http.test-port=8081

# =====================================================================
# Dev Mode (./mvnw quarkus:dev): live coding + hot reload + Dev UI
# =====================================================================
# Recarga en caliente al detectar cambios en el código fuente
quarkus.live-reload.instrumentation=true
# Dev UI disponible en http://localhost:8080/q/dev-ui
quarkus.dev-ui.cors.enabled=true
# Ejecución continua de tests: paused | enabled | disabled
quarkus.test.continuous-testing=paused

# =====================================================================
# OpenAPI (SmallRye) - especificación en /q/openapi
# =====================================================================
quarkus.smallrye-openapi.path=/q/openapi
quarkus.smallrye-openapi.info-title=1-quarkus-app API
quarkus.smallrye-openapi.info-version=1.0.0-SNAPSHOT
quarkus.smallrye-openapi.info-description=API REST del proyecto 1-quarkus-app

# =====================================================================
# Swagger UI - disponible en http://localhost:8080/q/swagger-ui
# =====================================================================
quarkus.swagger-ui.enabled=true
# Por defecto solo está en dev/test; true lo incluye también en producción
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.swagger-ui.title=1-quarkus-app - Swagger UI
quarkus.swagger-ui.try-it-out-enabled=true

# =====================================================================
# Logging
# =====================================================================
quarkus.log.level=INFO
quarkus.log.category."com.andres.courses.claude.quarkus".level=DEBUG
